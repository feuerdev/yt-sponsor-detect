<!DOCTYPE html>
<html>
  <head>
    <title>Sponsor Skipper</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 15px;
        min-width: 250px;
      }
      .container {
        display: flex;
        align-items: center;
        margin-top: 10px;
      }
      label {
        margin-left: 10px;
      }
      .setting {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h3>Sponsor Skipper</h3>
    <div class="container">
      <input type="checkbox" id="enabled-checkbox" />
      <label for="enabled-checkbox">Enable Sponsor Skipping</label>
    </div>

    <div class="container setting">
      <label for="confidence-slider">Confidence Threshold: </label>
      <input type="range" id="confidence-slider" min="0" max="1" step="0.01" />
      <span id="confidence-value">0.85</span>
    </div>

    <div class="container setting">
      <button id="clear-segments-btn" style="width: 100%">
        Clear Current Detections
      </button>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
