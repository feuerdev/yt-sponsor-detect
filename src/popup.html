<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sponsor Skipper</title>
<style>
:root{color-scheme:light dark;font:14px/1.5 system-ui,sans-serif}body{margin:0;padding:18px;width:340px;box-sizing:border-box;background:#101827;color:#e5edf8}h1{font-size:20px;margin:0}p{margin:8px 0;color:#b8c6d9}.status{padding:12px;margin:16px 0;background:#1c2a3e;border-radius:9px}label{display:flex;gap:10px;align-items:center;padding:8px 0}input{accent-color:#38bdf8}button{font:inherit;background:#253b55;color:inherit;border:1px solid #55728f;border-radius:6px;padding:7px 10px;cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #7dd3fc;outline-offset:2px}button[hidden]{display:none}button:disabled{opacity:.5;cursor:default}ol{padding-left:22px}li{margin:8px 0}small{color:#b8c6d9}details{margin-top:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.4 monospace}.actions{display:flex;gap:8px;margin:12px 0}#error{color:#fecaca}
</style></head><body>
<h1>Sponsor Skipper</h1><p>English sponsors. Analyzed on your device.</p>
<div class="status" role="status" aria-live="polite" id="status">Reading this video…</div>
<label><input id="enabled" type="checkbox" disabled> Enable sponsor detection</label>
<label><input id="automatic" type="checkbox" disabled> Skip sponsors automatically</label>
<label><input id="self-promotion" type="checkbox" disabled> Also skip self-promotion</label>
<div class="actions"><button id="pause" disabled>Pause skipping for this video</button><button id="retry" hidden>Retry analysis</button></div>
<p id="error" role="alert"></p><ol id="segments" aria-label="Detected intervals"></ol>
<small>Undo on the player replays the skipped interval. Estimates can include regular content.</small>
<details><summary>Analysis details</summary><pre id="diagnostics">No analysis yet.</pre></details>
<script src="viewer-popup.js"></script></body></html>
