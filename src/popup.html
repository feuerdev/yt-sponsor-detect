<!DOCTYPE html>
<html>
  <head>
    <title>Sponsor Skipper</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 15px;
        min-width: 300px; /* Increased width */
      }
      .container {
        display: flex;
        align-items: center;
        margin-top: 10px;
      }
      label {
        margin-left: 10px;
      }
      .setting {
        margin-top: 20px;
      }
      h4 {
        margin-top: 25px;
        margin-bottom: 5px;
        border-bottom: 1px solid #eee;
        padding-bottom: 5px;
      }
      .label-item {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .label-item input[type="text"] {
        width: 100%;
        box-sizing: border-box;
      }
      .label-item input[type="range"] {
        width: 80px; /* Adjust width as needed */
      }
      #add-label-btn {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h3>Sponsor Skipper</h3>
    <div class="container">
      <input type="checkbox" id="enabled-checkbox" />
      <label for="enabled-checkbox">Enable Sponsor Skipping</label>
    </div>

    <h4>Blocked Categories</h4>
    <div id="labels-list">
      <!-- Label items will be dynamically inserted here -->
    </div>
    <button id="add-label-btn">+ Add Category</button>

    <div class="container setting">
      <button id="clear-segments-btn" style="width: 100%">
        Clear & Re-analyze Current Video
      </button>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
